[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qnm"
version = "0.1.0"
description = "Quantized-Concept Network Model (QNM) Local Hybrid Engine & Autonomous Agent CLI"
readme = "README.md"
authors = [{ name = "Principal AI Systems Architect" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.12.0",
    "rich>=13.8.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "duckduckgo-search>=8.0.0",
]

[project.scripts]
qnm = "qnm.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
